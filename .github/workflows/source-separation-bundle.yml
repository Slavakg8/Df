name: Temporary source separation bundle

on:
  push:
    paths:
      - .github/workflows/source-separation-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download public runtime and UVR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/runtime bundle/models

          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.2/sherpa-onnx-v1.13.2-linux-x64-shared.tar.bz2 \
            -o /tmp/sherpa-onnx-runtime.tar.bz2
          tar -xjf /tmp/sherpa-onnx-runtime.tar.bz2 -C bundle/runtime --strip-components=1

          base=https://github.com/k2-fsa/sherpa-onnx/releases/download/source-separation-models
          for model in \
            UVR-MDX-NET-Inst_HQ_3.onnx \
            UVR-MDX-NET-Inst_HQ_4.onnx \
            UVR-MDX-NET-Inst_HQ_5.onnx \
            UVR_MDXNET_KARA_2.onnx
          do
            curl -fL --retry 5 --retry-delay 2 "$base/$model" -o "bundle/models/$model"
          done

          find bundle/runtime -type f -name 'sherpa-onnx-offline-source-separation' -print -exec chmod +x {} \;
          sha256sum bundle/models/* > bundle/SHA256SUMS.txt
          du -sh bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-separation-bundle
          path: bundle
          compression-level: 0
          retention-days: 1
